<title>AJ - Privacy policy</title>
<h1>AJ - Privacy policy</h1>
<p>AJ only accesses the Google account of its owner, with the owner's consent, and only to provide its own features.</p>
<p>No data is sold, shared with or transferred to any third party.</p>
<p>Access can be revoked at any time at <a href="https://myaccount.google.com/permissions">myaccount.google.com/permissions</a>.</p>
